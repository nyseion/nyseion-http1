[package]
name = "rimu-http1-bench"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rimu-http1 = { path = ".." }
httparse = "1.10"
# The rimu-ws parser rimu-http1 replaces, for comparison and differential tests.
rimu-ws = { path = "../../rimu-ws/wtx", default-features = false, features = ["http1-server-framework", "crypto-ring"] }

[profile.release]
codegen-units = 1
lto = "fat"

[workspace]
